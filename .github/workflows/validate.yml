name: Validate Smart Scanner

on:
  pull_request:
    branches:
      - feature/opening-price-breakout-strategy
  push:
    branches:
      - feature/opening-breakout-reentry-lifecycle

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest httpx
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
          # Test-only Fernet key; never use this value outside CI.
          SESSION_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: python -m pytest -q

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
